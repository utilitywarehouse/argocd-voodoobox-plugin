name: Go tests

on:
  push:
    tags:
      - "*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: geomys/sandboxed-step@7d75eb49d17fdeeb3656b3a57d35932d205bcfb9 # v1.2.1
        with:
          run: |
            version=$(grep -oP 'STRONGBOX_VERSION=\K[^ \\]+' Dockerfile)
            mkdir -p .bin
            curl -Ls "https://github.com/uw-labs/strongbox/releases/download/v${version}/strongbox_${version}_linux_amd64" \
              -o .bin/strongbox
            chmod +x .bin/strongbox
            export PATH="$PWD/.bin:$PATH"

            go test -race -v ./...
